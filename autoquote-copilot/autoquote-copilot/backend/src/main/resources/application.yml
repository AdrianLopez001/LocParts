spring:
  application:
    name: autoquote-copilot

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:autoquote}
    username: ${DB_USER:autoquote}
    password: ${DB_PASSWORD:autoquote}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    defer-datasource-initialization: true

  sql:
    init:
      mode: always

server:
  port: ${SERVER_PORT:8080}
